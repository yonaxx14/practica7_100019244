<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 7 - JavaScript</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="container py-4">
    <h1 class="mb-4">Práctica 7: Introducción a JavaScript</h1>

    <!-- a) Variables y salida -->
    <section class="card mb-4 p-4" id="sec-variables">
        <h2 class="h4">Variables y salida</h2>
        <button id="btnDatos" class="btn btn-primary mt-2">Mostrar mis datos</button>
        <p id="parDatos" class="mt-3"></p>
    </section>

    <!-- b) Calculadora de calificaciones -->
    <section class="card mb-4 p-4" id="sec-calcs">
        <h2 class="h4">Calculadora de calificaciones</h2>
        <div class="row g-2 mt-1">
            <div class="col"><input type="number" id="p1" class="form-control" placeholder="Parcial 1"></div>
            <div class="col"><input type="number" id="p2" class="form-control" placeholder="Parcial 2"></div>
            <div class="col"><input type="number" id="p3" class="form-control" placeholder="Parcial 3"></div>
        </div>
        <button id="btnCalc" class="btn btn-success mt-3">Calcular promedio</button>
        <p id="parCalc" class="mt-3 fw-bold"></p>
    </section>

    <!-- c) Lista dinámica -->
    <section class="card mb-4 p-4" id="sec-lista">
        <h2 class="h4">Lista dinámica</h2>
        <div class="input-group mt-2">
            <input type="text" id="inputItem" class="form-control" placeholder="Escribe un elemento">
            <button id="btnAgregar" class="btn btn-primary">Agregar</button>
            <button id="btnLimpiar" class="btn btn-outline-danger">Limpiar</button>
        </div>
        <ul id="milista" class="list-group mt-3"></ul>
    </section>

    <!-- d) Cambio de estilos -->
    <section class="card mb-4 p-4" id="sec-estilos">
        <h2 class="h4">Cambio de estilos</h2>
        <p>Cambia el color de fondo de esta sección:</p>
        <button class="btn btn-warning me-2" onclick="cambiarFondo('FFF3CD')">Amarillo</button>
        <button class="btn btn-info me-2" onclick="cambiarFondo('D1ECF1')">Azul</button>
        <button class="btn btn-success me-2" onclick="cambiarFondo('D4EDDA')">Verde</button>
        <button class="btn btn-secondary" onclick="cambiarFondo('FFFFFF')">Restaurar</button>
    </section>

    <!-- Scripts al final del body -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
